apiVersion: 1

providers:
  - name: 'Default Dashboards'
    orgId: 1
    folder: '' # The name of the folder in the Grafana UI (empty means Main)
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10 # How often Grafana scans for new/updated JSONs
    options:
      path: /var/lib/grafana/dashboards # Path INSIDE the container where JSONs live